<!-- Update src/index.html - add save button to toolbar -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratchpad</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://esm.sh/highlight.js@11/styles/atom-one-dark.css">
</head>
<body>
  <div class="app-container">
    <!-- Custom Titlebar -->
    <div class="titlebar" data-tauri-drag-region>
      <div class="titlebar-drag-region"></div>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search notes..." class="search-input">
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
      <div class="word-count" id="wordCount"></div>
      <div class="save-status" id="saveStatus">Saved</div>
      <div class="window-controls">
        <button class="window-btn minimize" id="minimizeBtn">−</button>
        <button class="window-btn maximize" id="maximizeBtn">□</button>
        <button class="window-btn close" id="closeBtn">×</button>
      </div>
    </div>

    <!-- Custom prompt modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-label" id="modalLabel"></div>
        <input type="text" class="modal-input" id="modalInput">
        <div class="modal-buttons">
          <button class="modal-btn cancel" id="modalCancel">Cancel</button>
          <button class="modal-btn confirm" id="modalConfirm">OK</button>
        </div>
      </div>
    </div>

    <div class="main-layout">
      <!-- Sidebar with folders -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h3>Folders</h3>
          <button class="icon-btn" id="newFolderBtn" title="New Folder">+</button>
        </div>
        <div class="bulk-actions" id="bulkActions" style="display:none;">
          <button class="bulk-action-btn" id="bulkDeleteBtn">Delete</button>
          <button class="bulk-action-btn" id="bulkMoveBtn">Move</button>
        </div>
        <div class="folder-tree" id="folderTree"></div>
        <div class="sidebar-section-header" id="tagSectionHeader">Tags</div>
        <div class="tag-list" id="tagList"></div>
      </div>

      <!-- Notes and editor area -->
      <div class="content-area">
        <!-- Toolbar -->
        <div class="toolbar">
          <button class="tool-btn" id="newNoteBtn" title="New Note (Ctrl+N)">
            <span>+ Note</span>
          </button>

          <button class="tool-btn" id="saveBtn" title="Save (Ctrl+S)">
            <span>💾 Save</span>
          </button>

          <div class="divider"></div>

          <button class="tool-btn" data-command="bold" title="Bold (Ctrl+B)">
            <strong>B</strong>
          </button>
          <button class="tool-btn" data-command="italic" title="Italic (Ctrl+I)">
            <em>I</em>
          </button>
          <button class="tool-btn" id="underlineBtn" title="Underline">
            <u>U</u>
          </button>

          <div class="divider"></div>

          <button class="tool-btn" id="bulletBtn" title="Bullet Points">
            • List
          </button>
          <button class="tool-btn" id="headingBtn" title="Heading (##)">
            H2
          </button>

          <div class="divider"></div>

          <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">↩</button>
          <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)">↪</button>

          <div class="divider"></div>

          <button class="tool-btn active" id="autosaveBtn" title="Toggle Auto-save">💾 Auto</button>

          <div class="divider"></div>

          <button class="tool-btn" id="bulkSelectBtn" title="Bulk Select">☑ Select</button>
        </div>

        <!-- Tabs -->
        <div class="tabs-bar">
          <div class="tabs-container" id="tabsContainer"></div>
        </div>

        <!-- Editor -->
        <div class="editor-container" id="editorContainer">
          <div class="editor-mode-bar">
            <button class="mode-btn active" id="editModeBtn">Edit</button>
            <button class="mode-btn" id="previewModeBtn">Preview</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
