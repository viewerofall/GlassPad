name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: scratchpad
            release_name: scratchpad-linux-x86_64

          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: scratchpad
            release_name: scratchpad-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: scratchpad
            release_name: scratchpad-macos-aarch64

          # Windows build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: scratchpad.exe
            release_name: scratchpad-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libappindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Create release (once per tag)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: gh release create ${{ github.ref_name }} --draft 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and upload artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          ls -la src-tauri/target/${{ matrix.target }}/release/
          find src-tauri/target/${{ matrix.target }}/release -name "${{ matrix.artifact_name }}" -type f
          gh release upload ${{ github.ref_name }} src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and upload artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -la src-tauri/target/${{ matrix.target }}/release/
          find src-tauri/target/${{ matrix.target }}/release -name "${{ matrix.artifact_name }}" -type f
          gh release upload ${{ github.ref_name }} src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and upload artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          dir src-tauri\target\${{ matrix.target }}\release\
          gh release upload ${{ github.ref_name }} src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
