name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: scratchpad
            release_name: scratchpad-linux-x86_64

          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: scratchpad
            release_name: scratchpad-macos-x86_64

          # Windows build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: scratchpad.exe
            release_name: scratchpad-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libappindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Create release (once per tag)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: gh release create ${{ github.ref_name }} --draft 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        run: gh release upload ${{ github.ref_name }} src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --clobber 2>/dev/null || echo "Upload failed, continuing..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          BINARY=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name scratchpad -type f 2>/dev/null | head -1)
          if [ -n "$BINARY" ]; then
            gh release upload ${{ github.ref_name }} "$BINARY" --clobber 2>/dev/null || echo "Upload failed, continuing..."
          else
            echo "Binary not found, continuing..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        run: gh release upload ${{ github.ref_name }} src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --clobber 2>/dev/null || echo "Upload failed, continuing..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
